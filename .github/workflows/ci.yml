name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the image (GNU Radio 3.10 + gr-foo + the gr-ieee802-11 fork at the
      # pinned refs in deps.env). The dependency build is cached as a layer keyed on
      # deps.env + scripts/build-deps.sh, so harness/test edits don't rebuild it.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sdr2wifi:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Run the asserting synthetic test matrix (legacy / HT20 / HT40 SISO + the
      # deterministic bit-exact 2x2 MIMO self-test + Rung-1 software loopback).
      - name: Run test matrix
        run: docker run --rm sdr2wifi:ci
